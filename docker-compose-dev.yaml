services:
  redis:
    image: redis:latest
    container_name: "${PROJECT_NAME}_redis"
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - backend

  frankenphp:
    container_name: "${PROJECT_NAME}_frankenphp"
    image: "${PROJECT_NAME}/frankenphp:latest-${ARCHITECTURE}"
    build:
      context: ./src/backend
      dockerfile: dev.Dockerfile
    restart: always
    environment:
      PHP_POST_MAX_SIZE: 64M
      PHP_IDE_CONFIG: "serverName=gravity"
      USER_AGENT_KEY: "BazzarifyConsumer"
      X_APP_KEY: "cxsQ3kyvU91Bgf7bks8dszQKdibdj83zyVOXEF99qww="
    env_file:
      - src/backend/.env.local
    networks:
      backend:
        aliases:
          - "local-ne.larashops.local"
    ports:
      - 8081:8081
      - 2019:2019
    depends_on:
      - postgres
    entrypoint: |
      php -d variables_order=EGPCS artisan octane:frankenphp
      --host=*.larashops.local
      --port=8081
      --caddyfile=/app/caddy/dev.Caddyfile
      --workers=1
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${API_SRC}:/app
  postgres:
    container_name: "${PROJECT_NAME}_postgres"
    image: "${PROJECT_NAME}/postgres:latest-${ARCHITECTURE}"
    build: 
      dockerfile: Dockerfile
      context: ./postgres
      args:
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres/data/project_db:/var/lib/postgresql/data
      - ${POSTGRES_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      TZ: ${TIMEZONE}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend
    ports:
      - 5432:5432

##--------------------------------------##
#    Blog Stack                         #
##--------------------------------------##
  mysql:
      image: mysql:8.0
      container_name: "${PROJECT_NAME}_mysql"
      restart: unless-stopped
      command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=256M
      environment:
        MYSQL_DATABASE: ${WORDPRESS_DB_NAME}
        MYSQL_USER: ${WORDPRESS_DB_USER}
        MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
        MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      volumes:
        - ./mysql/data:/var/lib/mysql
      networks:
        - blog_net
      healthcheck:
        test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_pass"]
        interval: 10s
        timeout: 5s
        retries: 5

  blog:
    image: wordpress:latest
    container_name: "${PROJECT_NAME}_blog"
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
    volumes:
      - blog_data:/var/www/html
    depends_on:
      - mysql
    networks:
      - blog_net

  phpmyadmin:
      image: phpmyadmin:latest
      container_name: "${PROJECT_NAME}_phpmyadmin"
      restart: unless-stopped
      ports:
        - "8082:80"
      environment:
        PMA_HOST: mysql
        PMA_USER: root
        PMA_PASSWORD: root_pass
        UPLOAD_LIMIT: 64M
      depends_on:
        - mysql
      networks:
        - blog_net

networks:
  backend:
    driver: bridge
  blog_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  blog_data:
