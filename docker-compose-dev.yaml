services:

  frankenphp:
    container_name: "${PROJECT_NAME}_frankenphp"
    image: "${PROJECT_NAME}/frankenphp:latest"
    build:
      context: ./src/backend
      dockerfile: dev.Dockerfile
    restart: always
    environment:
      PHP_IDE_CONFIG: serverName=gravity
      USER_AGENT_KEY: "BazzarifyConsumer"
      X_APP_KEY: "cxsQ3kyvU91Bgf7bks8dszQKdibdj83zyVOXEF99qww="
    networks:
      backend:
        aliases:
          - "local-ne.bazzarify.local"
    ports:
      - 8081:8081
    depends_on:
      - postgres
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${API_SRC}/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ${API_SRC}:/app
  postgres:
    container_name: "${PROJECT_NAME}_postgres"
    image: "${PROJECT_NAME}/postgres"
    build: 
      dockerfile: Dockerfile
      context: ./postgres
      args:
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres/data/project_db:/var/lib/postgresql/data
      - ${POSTGRES_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      TZ: ${TIMEZONE}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend
    ports:
      - 5432:5432

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
