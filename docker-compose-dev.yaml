services:
  static-runner:
    container_name: "${PROJECT_NAME}_static-runner"
    image: "${PROJECT_NAME}/frankenphp:static-gnu"
    build:
      context: ./src/backend
      dockerfile: static.Dockerfile
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
    platform: linux/amd64
    ports:
      - "9000:80"
    networks:
      backend:
        aliases:
          - static-runner
          - static-runner.internal

  redis:
    container_name: "${PROJECT_NAME}_redis"
    image: "${PROJECT_NAME}/redis:latest-${ARCHITECTURE}"
    build:
      context: ./redis
      dockerfile: Dockerfile
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis/data:/var/lib/redis/
      - ./redis/logs:/var/log/redis:r
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      backend:
        aliases:
          - redis
          - redis.internal
    mem_limit: 120m
    cpus: 0.20

  frankenphp:
    container_name: "${PROJECT_NAME}_frankenphp"
    image: "${PROJECT_NAME}/frankenphp:latest-${ARCHITECTURE}"
    build:
      context: ./src/backend
      dockerfile: dev.Dockerfile
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
    restart: always
    environment:
      PHP_POST_MAX_SIZE: 64M
      PHP_IDE_CONFIG: "serverName=gravity"
      USER_AGENT_KEY: "BazzarifyConsumer"
      X_APP_KEY: "cxsQ3kyvU91Bgf7bks8dszQKdibdj83zyVOXEF99qww="
      QUEUE_CONNECTION: "redis"
    env_file:
      - src/backend/.env.local
    networks:
      backend:
        aliases:
          - "local-ne.larashops.local"
    ports:
      - 8081:8081
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8081/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      pgbouncer:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        php -d variables_order=EGPCS artisan vendor:ensure-onboarding-bootstrap
        && exec php -d variables_order=EGPCS artisan octane:frankenphp
        --host=0.0.0.0 --port=8081 --caddyfile=/app/caddy/dev.Caddyfile --workers=1
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${API_SRC}:/app
    mem_limit: 1536m
    cpus: 0.50

  queue-worker:
    container_name: "${PROJECT_NAME}_queue-worker"
    image: "${PROJECT_NAME}/frankenphp:latest-${ARCHITECTURE}"
    build:
      context: ./src/backend
      dockerfile: dev.Dockerfile
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
    restart: always
    environment:
      PHP_POST_MAX_SIZE: 64M
      PHP_IDE_CONFIG: "serverName=gravity"
      USER_AGENT_KEY: "BazzarifyConsumer"
      X_APP_KEY: "cxsQ3kyvU91Bgf7bks8dszQKdibdj83zyVOXEF99qww="
      QUEUE_CONNECTION: "redis"
    env_file:
      - src/backend/.env.local
    networks:
      - backend
    depends_on:
      redis:
        condition: service_started
      pgbouncer:
        condition: service_healthy
    entrypoint:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=default
      - --sleep=1
      - --tries=1
      - --timeout=3600
    volumes:
      - ${API_SRC}:/app
    mem_limit: 768m
    cpus: 0.25

  pgbouncer:
    container_name: "${PROJECT_NAME}_pgbouncer"
    image: "${PROJECT_NAME}/pgbouncer:latest-${ARCHITECTURE}"
    build:
      context: ./pgbouncer
      dockerfile: Dockerfile
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 30m
    cpus: 0.05
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - 6432:6432

  postgres:
    container_name: "${PROJECT_NAME}_postgres"
    image: "${PROJECT_NAME}/postgres:latest-${ARCHITECTURE}"
    build:
      dockerfile: Dockerfile
      context: ./postgres
      args:
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres/data/project_db:/var/lib/postgresql/data
      - ${POSTGRES_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      TZ: ${TIMEZONE}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend
    ports:
      - 5432:5432
    mem_limit: 300m
    cpus: 0.25

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis_data:
