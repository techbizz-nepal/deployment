services:
  redis:
    container_name: "${PROJECT_NAME}_redis"
    image: "${PROJECT_NAME}/redis:latest-${ARCHITECTURE}"
    build:
      context: ./redis
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./redis/data:/var/lib/redis/
    networks:
      - backend
    mem_limit: 96m
    cpus: 0.10

  nginx:
    container_name: "${PROJECT_NAME}_nginx"
    image: "${PROJECT_NAME}/nginx:latest-${ARCHITECTURE}"
    restart: unless-stopped
    environment:
      ALLOWED_USER_AGENT: ${ALLOWED_USER_AGENT}
    ports:
      - '443:443'
    volumes:
      - ./nginx/log:/var/log/nginx
      # - blog_data:/var/www/html:rw
    depends_on:
      - consumer
      - vendor
      # - blog
    networks:
      - backend
      - frontend
    mem_limit: 48m
    cpus: 0.05
  consumer:
    container_name: "${PROJECT_NAME}_consumer"
    image: "${PROJECT_NAME}/consumer:latest-${ARCHITECTURE}"
    restart: unless-stopped
    environment:
      - X_APP_KEY=${X_APP_KEY}
    networks:
      - backend
    depends_on:
      frankenphp:
        condition: service_healthy
    mem_limit: 96m
    cpus: 0.10
  vendor:
    container_name: "${PROJECT_NAME}_vendor"
    image: "${PROJECT_NAME}/vendor:latest-${ARCHITECTURE}"
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      API_URL: ${API_URL}
      APP_KEY: ${APP_KEY}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NEXT_PUBLIC_PHONE_PREFIX: ${PHONE_PREFIX}
      NEXT_PUBLIC_ENVIRONMENT: ${ENV}
    networks:
      backend:
        aliases:
          - "vendor.local"
    depends_on:
      frankenphp:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.10
  frankenphp:
    container_name: "${PROJECT_NAME}_frankenphp"
    image: "${PROJECT_NAME}/frankenphp:latest-${ARCHITECTURE}"
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      USER_AGENT_KEY: "BazzarifyConsumer"
      X_APP_KEY: ${X_APP_KEY}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      PHP_POST_MAX_SIZE: 64M
      PHP_UPLOAD_MAX_FILESIZE: 64M
    entrypoint:
      - php
      - -d
      - variables_order=EGPCS
      - -d
      - memory_limit=256M
      - artisan
      - octane:frankenphp
      - --host=*.larashops.local
      - --port=8081
      - --caddyfile=/etc/caddy/Caddyfile
      - --workers=1
    networks:
      backend:
        aliases:
          - "local-ne.larashops.local"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8081/health || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      pgbouncer:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 384m
    cpus: 0.35

  queue-worker:
    container_name: "${PROJECT_NAME}_queue-worker"
    image: "${PROJECT_NAME}/frankenphp:latest-${ARCHITECTURE}"
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      USER_AGENT_KEY: "BazzarifyConsumer"
      X_APP_KEY: ${X_APP_KEY}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      PHP_POST_MAX_SIZE: 64M
      PHP_UPLOAD_MAX_FILESIZE: 64M
    networks:
      - backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "NONE" ]
    entrypoint:
      - php
      - -d
      - memory_limit=192M
      - artisan
      - queue:work
      - redis
      - --queue=default
      - --sleep=1
      - --tries=1
      - --timeout=3600
      - --memory=160
      - --max-jobs=50
      - --max-time=1800
    mem_limit: 224m
    cpus: 0.10

  pgbouncer:
    container_name: "${PROJECT_NAME}_pgbouncer"
    image: "${PROJECT_NAME}/pgbouncer:latest-${ARCHITECTURE}"
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 32m
    cpus: 0.05
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 20s
      timeout: 5s
      retries: 3

  postgres:
    container_name: "${PROJECT_NAME}_postgres"
    image: "${PROJECT_NAME}/postgres:latest-${ARCHITECTURE}"
    volumes:
      - ./postgres/data/project_db:/var/lib/postgresql/data
      - ${POSTGRES_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d:ro
    restart: always
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      TZ: ${TIMEZONE}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend
    ports:
      - 5432:5432
    mem_limit: 384m
    cpus: 0.15

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis_volume:
