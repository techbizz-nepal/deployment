services:
  redis:
    image: redis:latest
    container_name: "${PROJECT_NAME}_redis"
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - backend
  nginx:
    container_name: "${PROJECT_NAME}_nginx"
    image: "${PROJECT_NAME}/nginx:latest"
    restart: unless-stopped
    environment:
      - ALLOWED_USER_AGENT=${ALLOWED_USER_AGENT}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/log:/var/log/nginx
    depends_on:
      - consumer
      - vendor
    networks:
      - backend
      - frontend
  consumer:
    container_name: "${PROJECT_NAME}_consumer"
    image: "${PROJECT_NAME}/consumer:latest"
    restart: unless-stopped
    environment:
      - X_APP_KEY=${X_APP_KEY}
    networks:
      - backend
  vendor:
    container_name: "${PROJECT_NAME}_vendor"
    image: "${PROJECT_NAME}/vendor:latest"
    restart: unless-stopped
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
    networks:
      backend:
        aliases:
          - "vendor.local"

  frankenphp:
    container_name: "${PROJECT_NAME}_frankenphp"
    image: "${PROJECT_NAME}/frankenphp:latest"
    restart: always
    environment:
      USER_AGENT_KEY: "BazzarifyConsumer"
      X_APP_KEY: ${X_APP_KEY}
    networks:
      backend:
        aliases:
          - "local-ne.larashops.local"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
  postgres:
    container_name: "${PROJECT_NAME}_postgres"
    image: "${PROJECT_NAME}/postgres:latest"
    volumes:
      - ./postgres/data/project_db:/var/lib/postgresql/data
      - ${POSTGRES_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      TZ: ${TIMEZONE}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${project_db}" ]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - 5432:5432
    networks:
      - backend
networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
