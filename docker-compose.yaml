services:
  nginx:
    container_name: "${PROJECT_NAME}_nginx"
    image: "${PROJECT_NAME}/nginx:latest"
    restart: unless-stopped
    environment:
      - ALLOWED_USER_AGENT=${ALLOWED_USER_AGENT}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/log:/var/log/nginx
    depends_on:
      - consumer
      - vendor
    networks:
      - backend
      - frontend
  consumer:
    container_name: "${PROJECT_NAME}_consumer"
    image: "${PROJECT_NAME}/consumer:latest"
    restart: unless-stopped
    environment:
      - X_APP_KEY=${X_APP_KEY}
    networks:
      - backend
  vendor:
    container_name: "${PROJECT_NAME}_vendor"
    image: "${PROJECT_NAME}/vendor:latest"
    restart: unless-stopped
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
    networks:
      backend:
        aliases:
          - "vendor.local"

  frankenphp:
    container_name: "${PROJECT_NAME}_frankenphp"
    image: "${PROJECT_NAME}/frankenphp:latest"
    restart: always
    environment:
      USER_AGENT_KEY: "BazzarifyConsumer"
      X_APP_KEY: ${X_APP_KEY}
    networks:
      backend:
        aliases:
          - "local-ne.bazzarify.local"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
  postgres:
    container_name: "${PROJECT_NAME}_postgres"
    image: "${PROJECT_NAME}/postgres:latest"
    volumes:
      - ./postgres/data/project_db:/var/lib/postgresql/data
      - ${POSTGRES_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      TZ: ${TIMEZONE}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend
  # webhook:
  #   image: "${PROJECT_NAME}/webhook:latest"
  #   container_name: "${PROJECT_NAME}_webhook"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: [ "-hooks", "/config/hooks.json", "-verbose" ]
  #   restart: unless-stopped
  #   networks:
  #     - backend
  #     - frontend

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
