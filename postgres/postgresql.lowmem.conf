# =============================
# PostgreSQL Low-Memory Config
# Target: 300–350 MB RAM usage
# =============================

# --- MEMORY ---
shared_buffers = 64MB
work_mem = 2MB
maintenance_work_mem = 32MB
effective_cache_size = 128MB
temp_buffers = 4MB

# Max connections kept low to avoid RAM explosion
max_connections = 30

# Enable hugepages safely
huge_pages = off

# --- WAL / CHECKPOINTS ---
wal_buffers = 4MB
checkpoint_timeout = 15min
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

# --- AUTOVACUUM ---
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_cost_limit = 200
autovacuum_vacuum_scale_factor = 0.05

# --- LOGGING ---
log_min_duration_statement = 250ms
log_temp_files = 0
log_checkpoints = on
log_autovacuum_min_duration = 0

# --- QUERY PLANNER ---
random_page_cost = 4
effective_io_concurrency = 1
default_statistics_target = 50

# --- CLIENT TIMEOUTS ---
statement_timeout = 60s
idle_in_transaction_session_timeout = 30s
lock_timeout = 5s
