server {

    # For https
    listen 443 ssl;
    # listen [::]:4460 ssl ipv6only=on;
    ssl_certificate /etc/nginx/ssl/bazzarify.com.pem;
    ssl_certificate_key /etc/nginx/ssl/bazzarify.com.key;

    listen 80;
    server_name vendor.bazzarify.local vendor.bazzarify.com admin.bazzarify.com;
    include /etc/nginx/sites-available/config/index.conf;
    

    
    location / {
        proxy_pass http://vendor:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    # For https
    listen 443 ssl;
    # listen [::]:4460 ssl ipv6only=on;
    ssl_certificate /etc/nginx/ssl/bazzarify.com.pem;
    ssl_certificate_key /etc/nginx/ssl/bazzarify.com.key;

    listen 80;
    server_name bazzarify.local www.bazzarify.local consumer.bazzarify.local bazzarify.com consumer.bazzarify.com www.bazzarify.com;
    include /etc/nginx/sites-available/config/index.conf;

    location / {
        proxy_pass http://consumer:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    listen 80;
    server_name webhook.bazzarify.com;

    ssl_certificate     /etc/nginx/ssl/bazzarify.com.pem;
    ssl_certificate_key /etc/nginx/ssl/bazzarify.com.key;

    # Restrict to GitHub webhook requests only
    location = /hooks/deploy {
        # GitHub always sends X-GitHub-Event header
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        if ($http_x_github_event = "") {
            return 403;
        }
        proxy_pass         http://webhook:9000/hooks/deploy;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
    }

    # Block all other endpoints
    location / {
        return 404;
    }
}