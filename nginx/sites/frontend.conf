server {
    listen 80;
    server_name vendor.bazzarify.local vendor.bazzarify.com admin.bazzarify.com;
    include /etc/nginx/sites-available/config/index.conf;
    
    location / {
        proxy_pass http://vendor:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name bazzarify.local consumer.bazzarify.local bazzarify.com consumer.bazzarify.com;
    include /etc/nginx/sites-available/config/index.conf;

    location / {
        proxy_pass http://consumer:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}