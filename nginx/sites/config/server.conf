server {
        listen 80;
        listen [::]:80;

        # SSL settings
        listen 443 ssl;
        listen [::]:4460 ssl ipv6only=on;
        ssl_certificate /etc/nginx/ssl/bazzarify.pem;
        ssl_certificate_key /etc/nginx/ssl/bazzarify-key.pem;
        return 301 https://$host$request_uri;

        location ~ \.php$ {
            try_files $uri /index.php =404;
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param APP_COUNTRY $country;
            fastcgi_param APP_ENV $env;
            fastcgi_param APP_URL $host;

            # Fixes timeouts
            fastcgi_read_timeout 600;
            include fastcgi_params;
        }
        error_log /var/log/nginx/app_error.log;
        access_log /var/log/nginx/app_access.log;
}
