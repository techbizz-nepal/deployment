# Restrict direct IP access
if ($host ~* "^(\d{1,3}\.){3}\d{1,3}$") {
    return 403;
}

# Allow React Native App & Postman requests by custom headers
set $allow_request 0;

# Allow Postman (User-Agent contains "PostmanRuntime")
if ($http_user_agent ~* "PostmanRuntime") {
    set $allow_request 1;
}

# Allow React Native App (Custom Header)
if ($http_x_app_key = "cxsQ3kyvU91Bgf7bks8dszQKdibdj83zyVOXEF99qww=") {
    set $allow_request 1;
}

if ($http_user_agent ~* "(Chrome|Firefox|Safari|Edge|Opera|MSIE|Trident|Vivaldi|Brave|Mozilla)") {
    set $allow_request 1;
}


# Block if request is not allowed
if ($allow_request = 0) {
    return 403;
}
