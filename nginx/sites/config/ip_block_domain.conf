if ($host ~* "^(\d{1,3}\.){3}\d{1,3}$") {
    return 403;
}

set $allow_request 0;

if ($http_user_agent ~* "(Chrome|Firefox|Safari|Edge|Opera|MSIE|Trident|Vivaldi|Brave|Mozilla|${ALLOWED_USER_AGENT})") {
    set $allow_request 1;
}

if ($allow_request = 0) {
    return 403 '{"data": {"message": "", "payload": ""}, "metaData": {"error": "Forbidden", "errorCode":"403"}}';
}
